name: (Auto) Build KMonad
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  packages: write
  contents: write

jobs:
  check-releases:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.find-new.outputs.tags }}
    steps:
      - name: Get KMonad releases
        run: |
          curl -s "https://api.github.com/repos/kmonad/kmonad/releases?per_page=20" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            > upstream_releases.json
          echo "Upstream releases:"
          jq -r '.[].tag_name' upstream_releases.json

      - name: Get our existing releases
        run: |
          curl -s "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            > our_releases.json
          echo "Our releases:"
          jq -r '.[].tag_name' our_releases.json

      - name: Find tags we haven't built yet
        id: find-new
        run: |
          UPSTREAM=$(jq -r '.[].tag_name' upstream_releases.json)
          OURS=$(jq -r '.[].tag_name' our_releases.json)
          NEW_TAGS=()
          for tag in $UPSTREAM; do
            if ! echo "$OURS" | grep -qx "$tag"; then
              # Strip leading 'v' and check version is >= 0.4.0
              VERSION=$(echo "$tag" | sed 's/^v//')
              if printf '%s\n' "0.4.0" "$VERSION" | sort -V -C; then
                NEW_TAGS+=("$tag")
              fi
            fi
          done
          if [ ${#NEW_TAGS[@]} -eq 0 ]; then
            echo "No new releases to build."
            echo "tags=[]" >> $GITHUB_OUTPUT
          else
            echo "New tags to build: ${NEW_TAGS[*]}"
            JSON=$(printf '%s\n' "${NEW_TAGS[@]}" | jq -R . | jq -sc .)
            echo "tags=$JSON" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-releases
    if: |
      needs.check-releases.outputs.tags != '[]' &&
      needs.check-releases.outputs.tags != ''
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.check-releases.outputs.tags) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: kmonad/kmonad
          ref: ${{ matrix.tag }}

      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -scope CurrentUser
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          scoop install stack

      - name: Compile KMonad
        run: stack build

      - name: Install KMonad
        run: stack install

      - name: Set APPDATA
        run: echo ("APPDATA_DIR=" + $env:APPDATA) >> $env:GITHUB_ENV

      - name: Upload KMonad artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmonad-${{ matrix.tag }}
          path: ${{ env.APPDATA_DIR }}\local\bin\

      - name: Upload KMonad release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: "Release ${{ matrix.tag }}"
          make_latest: true
          files: ${{ env.APPDATA_DIR }}\local\bin\kmonad.exe
